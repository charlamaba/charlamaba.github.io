        }

        .thumbnail-active {

            box-shadow: 0 0 8px #DDDDDD;
        }

        .preview-container {
            width: -webkit-fill-available;
            position: fixed;
            margin-left: 180px;
            margin-top: 30px;
            margin-right: 10%;
        }

            overflow: scroll;

        }

        }

        .preview-mobile-container {

            display: flex;

        }

            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 5px #DDDDDD;
            overflow: scroll;
            container-type: inline-size;

            display: flex;
            margin: 10px 0;
        }

        }

            padding-left: 1em;

            padding: 0;

        ul.techs li {

        function parseDate(dateString) {
            if (!isNaN(Date.parse(dateString))) {
                const date = new Date(dateString + "-01");
                const formattedDate = date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: 'short' // use long for non-abbreviated
                });
                return formattedDate;
            }
            return dateString;
        }

        function generateProjectHtml(project) {
            const responsibilitiesList = project.responsibilities || [];
            let responsibilities = '';
            if (responsibilitiesList.length > 0) {
                responsibilities = `
                    <h4>Key Responsibilities </h4>
                    <ul>${responsibilitiesList.map(resp => `<li>${resp}</li>`).join('')}</ul>
                    `;
            }

            const techList = project.techs || [];
            let techs = techList.map(tech => `<li>${tech}</li>`).join('');

            return `
                <h1 class="name">${project.name}</h1>
                <h4 class="company">${project.company} </h4>
                <h4 class="role">${project.role} <span class="start-end">${parseDate(project.start)} – ${parseDate(project.end)}</span></h4>
                <p>${project.description}</p>
                <p>${project.moreDeets}</p>

                <div class="responsibilities-container">${responsibilities}</div>
                <ul class='techs'>${techs}</ul>
            `;
        }

        function showProjectWebViewActive(projectName) {
            showThumbnailActive(projectName);
            let preview = document.getElementById("preview");
            const project = resume.projects.find(proj => proj.name === projectName);
            preview.innerHTML = generateProjectHtml(project);
        }

        function populateProjectsWebView(project) {
            if (!project) return;

            let thumbnail = generateProjectThumbnail(project)
            thumbnail.onclick = function() { showProjectWebViewActive(project.name);};
            const thumbnails = document.getElementById("thumbnails");
            thumbnails.appendChild(thumbnail);
        }

        function populateProjectsMobileView(project) {
            if (!project) return;

            const previewContainer = document.getElementById("preview-mobile-container");
            let preview = document.createElement('div');
            preview.className = 'preview-mobile';
            preview.innerHTML = generateProjectHtml(project);
            previewContainer.appendChild(preview);
        }

        function generateProjectThumbnail(project) {
            if (!project) return;

            const img = document.createElement('img');
            img.src = project.thumbnail || project.companyLogo;
            img.alt = project.name;
            img.ariaLabel = project.name;
            img.className = 'thumbnail';
            return img;
        }

        function showThumbnailActive(projectName) {
            const activeThumbnail = document.querySelector(`.thumbnail[aria-label="${projectName}"]`);
            if (activeThumbnail) {
                document.querySelectorAll('.thumbnail').forEach(thumbnail => {
                    thumbnail.classList.remove("thumbnail-active");
                });
                activeThumbnail.classList.add("thumbnail-active");
            }
        }

        function thumbnailListener() {
            let closestThumbnail = null;
            let closestDistance = Infinity;
            const thumbnails = document.querySelectorAll('.thumbnail');

            thumbnails.forEach(thumbnail => {
                const thumbnailRect = thumbnail.getBoundingClientRect();
                const elementCenter = thumbnailRect.top + thumbnailRect.height / 2;
                const viewportHeight = window.innerHeight / 2;
                
                const distance = Math.abs(elementCenter - viewportHeight);

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestThumbnail = thumbnail;
                }
            });

            // If a centered thumbnail is found, update the preview image
            if (closestThumbnail) {
                showProjectWebViewActive(closestThumbnail.ariaLabel)
            }
        }
           
        function centerFirstAndLastThumbnail() {
            const thumbnails = document.getElementById('thumbnails');
            let firstChild = thumbnails.firstElementChild;
            let lastChild = thumbnails.lastElementChild;
            const itemHeight = firstChild.clientHeight;
            const screenHeight = document.documentElement.clientHeight;
            const margin = (screenHeight - itemHeight) / 2;

            firstChild.style.marginTop = margin - 200 + 'px';
            lastChild.style.marginBottom = margin + 'px';
        }

        function loadProjects() {
            if (!resume || !resume.projects) {
                // TODO: display work in progress
                return;
            }

            resume.projects.forEach(project => {
                if (!project.hidden) {
                    populateProjectsWebView(project);
                    populateProjectsMobileView(project);
                }
            });

            centerFirstAndLastThumbnail(); 
            showProjectWebViewActive(resume.projects[0].name);
            window.addEventListener('scroll', thumbnailListener);
        }
        
        loadProjects();
    </script>

    <script>
        function setTheme() {
            const initialScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.body.style.colorScheme = initialScheme;

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                const newScheme = e.matches ? 'dark' : 'light';
                document.body.style.colorScheme = newScheme;
            });
        }

        setTheme();

    </script>

</body>
